<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div id="wrapper">
        <section id="header">
            <div id="heading-wrapper">
                <h1>ROCK</h1>
                <h1>PAPER</h1>
                <h1>SCISSORS</h1>
            </div>

            <div id="scoreboard">
                <p id="score-text">SCORE</p>
                <div id="score"></div>
            </div>
        </section>
        <main id="hero-section">
            <button id="paper">
                <img src="./images/icon-paper.svg" alt="">
            </button>
            <button id="scissors">
                <img src="./images/icon-scissors.svg" alt="Scissors image">
            </button>
            <button id="rock">
                <img src="./images/icon-rock.svg" alt="Rock image">
            </button>
        </main>
    </div>
</body>
</html>
